<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-bus 工作台</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --line: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --blue: #58a6ff; --green: #3fb950;
    --purple: #bc8cff; --yellow: #d29922; --red: #f85149; --cyan: #39c5cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13.5px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    /* grid-template-rows 必须显式给死。只写 height:100vh 的话隐式行是 auto，
       会被内容顶高：气泡比旧日志行高 4 倍多，#msgs 直接长到 6000px，
       overflow-y:auto 不生效，composer 被推到屏幕外。
       min-height:0 是配套的：flex 子项默认 min-height:auto，不给 0 的话
       #msgs 不会收缩到容器高度以下，仍然撑爆。 */
    display: grid; grid-template-columns: 286px 1fr 344px;
    grid-template-rows: 100%;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  body > * { min-height: 0; min-width: 0; }
  .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", monospace; }
  .col { overflow-y: auto; }
  .col::-webkit-scrollbar { width: 8px; }
  .col::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  /* ---- 左栏 ---- */
  #left { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 12px 40px; }
  .sec { margin-bottom: 18px; }
  .sec h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim);
    margin: 0 0 8px; font-weight: 600;
  }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 7px; }
  .member { cursor: pointer; transition: border-color .12s; }
  .member:hover { border-color: var(--blue); }
  .member.sel { border-color: var(--blue); background: #17233a; }
  .member .top { display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #484f58; flex: 0 0 auto; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.busy { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .mname { font-weight: 600; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 20px;
    background: #21262d; color: var(--dim); border: 1px solid var(--line);
  }
  .badge.ceo { background: #341a00; color: #f0b72f; border-color: #6b4400; }
  .meta { color: var(--dim); font-size: 11px; margin-top: 4px; }

  .task { border-left: 2px solid var(--line); padding: 5px 8px; margin-bottom: 5px; font-size: 12px; }
  .task.open { border-left-color: var(--yellow); }
  .task.claimed { border-left-color: var(--blue); }
  .task.done { border-left-color: var(--green); opacity: .62; }
  .task .t { color: var(--dim); font-size: 10.5px; }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sw {
    position: relative; width: 38px; height: 20px; border-radius: 20px;
    background: #30363d; cursor: pointer; transition: background .15s; flex: 0 0 auto;
  }
  .sw::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #8b949e; transition: transform .15s, background .15s;
  }
  .sw.on { background: #1f6f3f; }
  .sw.on::after { transform: translateX(18px); background: #fff; }
  input[type=number] {
    width: 54px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font-size: 12px;
  }
  .warn { background: #3d1c00; border: 1px solid #6b4400; color: #f0b72f; border-radius: 8px; padding: 8px 10px; font-size: 12px; }

  /* ---- 中栏 ---- */
  #mid { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #topbar {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto;
  }
  #topbar .title { font-weight: 600; }
  #topbar .sp { flex: 1; }
  .filter { display: flex; gap: 4px; }
  .filter button {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
  }
  .filter button.on { background: #17233a; color: var(--blue); border-color: var(--blue); }
  /* flex:1 + min-height:0：#msgs 才是「可滚动的剩余空间」，而不是「内容多高就多高」。
     缺 min-height:0 时它不收缩，气泡一多就把 composer 顶出屏幕。 */
  #msgs { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 12px 14px 20px; }
  /* ---- 群聊气泡 ---- */
  .day {
    text-align: center; color: #484f58; font-size: 11px; margin: 14px 0 8px;
  }
  .day span { background: var(--panel2); border-radius: 20px; padding: 2px 12px; }
  .row { display: flex; gap: 10px; padding: 3px 8px; }
  .row.mine { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; user-select: none;
  }
  .avatar.sq { border-radius: 8px; }
  .bubblewrap { max-width: 74%; min-width: 0; }
  .nick { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .row.mine .nick { flex-direction: row-reverse; }
  .bubble {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 11px; white-space: pre-wrap; word-break: break-word;
    border-top-left-radius: 2px;
  }
  .row.mine .bubble { background: #1f6f3f; border-color: #2ea043; border-top-left-radius: 10px; border-top-right-radius: 2px; }
  .bubble.auto { background: #1d1526; border-color: #3d2a55; }
  .bubble.blocked { background: #241a00; border-color: #6b4400; }
  .row.cont { margin-top: -4px; }
  .row.cont .avatar { visibility: hidden; }
  .meta2 { font-size: 10.5px; color: #484f58; margin-top: 3px; display: flex; gap: 6px; align-items: center; }
  .row.mine .meta2 { flex-direction: row-reverse; }
  .chip {
    font-size: 10px; padding: 0 5px; border-radius: 4px;
    background: #21262d; color: var(--dim); border: 1px solid var(--line);
  }
  .chip.task { background: #341a00; color: #f0b72f; border-color: #6b4400; }
  .chip.done { background: #0f2f18; color: var(--green); }
  .chip.claim { background: #10243f; color: var(--blue); }
  .chip.hop { color: var(--purple); border-color: #4b2d6b; }
  .chip.bcast { color: var(--cyan); border-color: #1d4b4f; }
  .release {
    font-size: 10.5px; background: #3d2a55; color: var(--purple);
    border: 1px solid #4b2d6b; border-radius: 5px; padding: 1px 7px; cursor: pointer;
  }
  .release:hover { background: #4b2d6b; }
  /* 发出去没人接时的状态条：先「等回复」，超时后变成原因 */
  .pending {
    font-size: 10.5px; color: var(--dim); margin-top: 3px;
    display: flex; gap: 5px; align-items: center;
  }
  .row.mine .pending { flex-direction: row-reverse; }
  .pending.wait { color: var(--yellow); }
  .pending.note { color: var(--yellow); }
  .typing { display: flex; gap: 3px; align-items: center; padding: 9px 11px; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
    animation: blink 1.3s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  #composer { border-top: 1px solid var(--line); padding: 10px 14px 14px; background: var(--panel); flex: 0 0 auto; }
  #composer .tip {
    font-size: 11px; color: var(--cyan); margin-bottom: 6px; min-height: 15px;
  }
  #composer .tip.named { color: var(--purple); }
  #composer .tip.warn { color: var(--yellow); }
  #composer .row { display: flex; gap: 8px; align-items: flex-end; }
  #say {
    flex: 1; min-height: 42px; max-height: 150px; resize: vertical;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font: inherit; font-size: 13px;
  }
  #say:focus { outline: none; border-color: var(--blue); }
  #send {
    background: #1f6f3f; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #send:disabled { opacity: .5; cursor: default; }
  #hint { color: var(--dim); font-size: 11px; margin-top: 6px; }

  /* ---- 右栏 ---- */
  #right { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 12px 40px; }
  #right .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #right .head .n { font-weight: 600; font-size: 14px; }
  .ev { border-left: 2px solid var(--line); padding: 4px 9px; margin-bottom: 6px; font-size: 12px; }
  .ev.thought { border-left-color: #4b2d6b; color: #9d8bb0; font-style: italic; }
  .ev.tool { border-left-color: var(--yellow); color: #c9a227; }
  .ev.answer { border-left-color: var(--blue); }
  .ev.replied { border-left-color: var(--green); color: var(--green); }
  .ev.error { border-left-color: var(--red); color: var(--red); }
  .ev .t { color: #484f58; font-size: 10px; }
  .empty { color: #484f58; font-size: 12px; text-align: center; padding: 30px 10px; }
</style>
</head>
<body>

<aside id="left" class="col">
  <div class="sec">
    <h3>成员</h3>
    <div id="members"></div>
  </div>

  <div class="sec">
    <h3>CEO（派活权）</h3>
    <div class="card">
      <div class="switch">
        <span id="ceoName" class="mono">—</span>
        <select id="ceoPick" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:3px 6px;font-size:12px"></select>
      </div>
    </div>
  </div>

  <div class="sec">
    <h3>自动对话</h3>
    <div class="card">
      <div class="switch">
        <span>总开关</span>
        <div id="autoSw" class="sw"></div>
      </div>
      <div class="switch" style="margin-top:9px">
        <span style="font-size:12px">最大跳数</span>
        <input id="maxHop" type="number" min="0" max="20" step="1" value="3">
      </div>
      <div class="meta" id="autoMeta">关：只有人说话才投喂</div>
    </div>
    <div id="breakerBox" style="display:none" class="warn"></div>
  </div>

  <div class="sec">
    <h3>任务看板</h3>
    <div id="tasks"><div class="empty">还没有任务</div></div>
  </div>

  <div class="sec">
    <h3>统计</h3>
    <div class="card mono" id="counts" style="font-size:11.5px;color:#8b949e"></div>
  </div>
</aside>

<main id="mid">
  <div id="topbar">
    <span class="title">消息流</span>
    <span class="badge mono" id="seqBadge">seq 0</span>
    <span class="sp"></span>
    <div class="filter">
      <button data-f="all" class="on">全部</button>
      <button data-f="human">人工</button>
      <button data-f="auto">自动</button>
      <button data-f="named">点名</button>
    </div>
  </div>
  <div id="msgs" class="col"></div>
  <div id="composer">
    <div id="composertip" class="tip">发给全体 · 谁先抢到谁回</div>
    <div class="row">
      <textarea id="say" placeholder="说话…（不点名 = @全体；@hermes 只给它，@opencode 转交）"></textarea>
      <button id="send">发送</button>
    </div>
    <div id="hint">回车发送 · Shift+回车换行 · 带 @名字 定向点名，不带则 @全体（一人回复）· hop 到顶的消息标黄，点「放行」继续</div>
  </div>
</main>

<aside id="right" class="col">
  <div class="head">
    <span class="n" id="agentName">未选中</span>
    <span class="sp" style="flex:1"></span>
    <button id="cancelBtn" class="badge" style="cursor:pointer;display:none">中断本轮</button>
  </div>
  <div id="events"><div class="empty">点左边成员卡，看它的思考流和工具调用</div></div>
</aside>

<script>
const $ = (s) => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = (s) => String(s ?? '');
const hhmmss = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleTimeString('zh-CN', { hour12: false }); };

let STATE = null;
let MSGS = [];
let AGENTS = ['dsh', 'hermes', 'opencode'];
let SEL = null;
let FILTER = 'all';
const EVENTS = new Map();   // agent -> [{...}]

// ---------- 渲染 ----------
function renderMembers() {
  const box = $('#members');
  box.innerHTML = '';
  for (const m of STATE?.members || []) {
    const c = el('div', 'card member' + (SEL === m.name ? ' sel' : ''));
    const top = el('div', 'top');
    const dot = el('div', 'dot' + (m.online ? (m.state === 'thinking' ? ' busy' : ' on') : ''));
    top.append(dot, el('span', 'mname', m.name));
    if (STATE.ceo === m.name) top.append(el('span', 'badge ceo', 'CEO'));
    if (m.state === 'thinking') top.append(el('span', 'badge', '思考中 #' + m.currentSeq));
    else if (m.state === 'breaker') top.append(el('span', 'badge', '熔断'));
    else if (!m.online) top.append(el('span', 'badge', 'offline'));
    c.append(top);
    c.append(el('div', 'meta', `${m.msgs} 条（自动 ${m.auto}）` + (m.lastAt ? ' · ' + hhmmss(m.lastAt) : '')));
    c.onclick = async () => {
      SEL = m.name;
      renderMembers();
      $('#agentName').textContent = m.name;
      $('#cancelBtn').style.display = '';
      // 先把历史事件拉回来，否则点进去永远是空的（SSE 只推增量）
      try {
        const r = await (await fetch('/api/events?agent=' + encodeURIComponent(m.name) + '&limit=200')).json();
        EVENTS.set(m.name, r.events || []);
      } catch {}
      renderEvents();
    };
    box.append(c);
  }
}

function renderCeo() {
  $('#ceoName').textContent = STATE?.ceo || '未指定';
  const pick = $('#ceoPick');
  const names = ['(未指定)', ...AGENTS];
  pick.innerHTML = '';
  for (const n of names) {
    const o = el('option', null, n);
    o.value = n === '(未指定)' ? '' : n;
    if ((STATE?.ceo || '') === o.value) o.selected = true;
    pick.append(o);
  }
}

function renderConfig() {
  const c = STATE?.config || {};
  $('#autoSw').className = 'sw' + (c.autoChat ? ' on' : '');
  $('#maxHop').value = c.maxHop ?? 3;
  $('#autoMeta').textContent = c.autoChat ? '开：点名的 agent 会自动回复' : '关：只有人说话才投喂';
  // 开了开关但没人能答，是最容易让人以为「坏了」的状态：开关看着是开的，
  // 消息却石沉大海。这里直接把原因写在开关底下。
  const live = (STATE?.members || []).filter((m) => m.online);
  if (c.autoChat && !live.length) {
    $('#autoMeta').textContent = '开关开着，但没有 driver 在跑 → 没人会回';
    $('#autoMeta').style.color = 'var(--yellow)';
  } else if (c.autoChat) {
    $('#autoMeta').textContent = `开：${live.map((m) => m.name).join(' / ')} 会抢着回`;
    $('#autoMeta').style.color = '';
  } else {
    $('#autoMeta').textContent = '关：发出去不会有人回';
    $('#autoMeta').style.color = '';
  }
  const bb = $('#breakerBox');
  if (STATE?.paused) {
    bb.style.display = '';
    bb.textContent = `已暂停：${STATE.pauseReason || '熔断'}（${Math.max(0, Math.round((STATE.pausedUntil - Date.now()) / 1000))}s 后自动解除）`;
  } else bb.style.display = 'none';
}

function renderTasks() {
  const box = $('#tasks');
  const ts = (STATE?.tasks || []).slice(-14).reverse();
  if (!ts.length) { box.innerHTML = '<div class="empty">还没有任务</div>'; return; }
  box.innerHTML = '';
  for (const t of ts) {
    const cls = t.closed ? 'done' : (t.claimedBy ? 'claimed' : 'open');
    const d = el('div', 'task ' + cls);
    d.append(el('div', null, `#${t.seq} ${t.text}`));
    d.append(el('div', 't', t.closed ? `完成 → ${t.closedTo}` : (t.claimedBy ? `认领：${t.claimedBy}` : `待认领 · ${t.from}`)));
    box.append(d);
  }
}

function renderCounts() {
  const c = STATE?.counts || {};
  $('#counts').textContent = `总 ${c.total ?? 0} 条 · 人工 ${c.human ?? 0} · 自动 ${c.auto ?? 0}`;
  $('#seqBadge').textContent = 'seq ' + (c.lastSeq ?? 0);
}

function passFilter(m) {
  if (FILTER === 'human') return !m.via || m.via === 'human';
  if (FILTER === 'auto') return m.via && m.via !== 'human';
  if (FILTER === 'named') return !!(m.to || m.mentions);
  return true;
}

/** 每个成员一个稳定颜色 + 首字（拍脑袋取哈希，不存配置） */
const AVATAR_HUE = {};
function hueOf(name) {
  if (AVATAR_HUE[name] != null) return AVATAR_HUE[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return (AVATAR_HUE[name] = h);
}
function initialOf(name) {
  return String(name || '?').trim().charAt(0).toUpperCase() || '?';
}
function avatarNode(name) {
  const h = hueOf(name);
  const a = el('div', 'avatar sq', initialOf(name));
  a.style.background = `hsl(${h} 46% 38%)`;
  a.title = name;
  return a;
}

const dayKey = (ts) => {
  const d = new Date(ts);
  return isNaN(d) ? '' : `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
};
const isToday = (ts) => dayKey(ts) === dayKey(Date.now());

/**
 * 群聊气泡。同一人 3 分钟内连发：隐藏头像和昵称，只留气泡（连续消息合并），
 * 否则每句话都顶着一个大脑袋，群聊看着像日志。
 */
function msgNode(m, prev) {
  const isAuto = m.via && m.via !== 'human';
  const mine = m.from === 'human' || (!isAuto && m.from === 'human');
  const bcast = m.to === '*';
  const overHop = isAuto && (m.hop || 0) >= (STATE?.maxHop ?? 3) && !(STATE?.config?.hopReset || {})[m.thread];

  const cont = prev && prev.from === m.from
    && Math.abs(new Date(m.ts) - new Date(prev.ts)) < 180000;

  const row = el('div', 'row' + (mine ? ' mine' : '') + (cont ? ' cont' : ''));
  row.append(avatarNode(m.from));

  const wrap = el('div', 'bubblewrap');
  if (!cont) {
    const nick = el('div', 'nick');
    nick.append(el('span', null, m.from));
    if (m.from === (STATE?.ceo || '')) nick.append(el('span', 'badge ceo', 'CEO'));
    if (bcast) nick.append(el('span', 'chip bcast', '@全体'));
    else if (m.to) nick.append(el('span', 'chip', '→ ' + m.to));
    wrap.append(nick);
  }

  const bub = el('div', 'bubble' + (isAuto ? ' auto' : '') + (overHop ? ' blocked' : ''));
  bub.textContent = m.text;
  wrap.append(bub);

  const meta = el('div', 'meta2');
  meta.append(el('span', null, hhmmss(m.ts)));
  if (m.kind !== 'msg') meta.append(el('span', 'chip ' + m.kind, m.kind));
  if (m.hop > 0) meta.append(el('span', 'chip hop', '↻' + m.hop));
  if (isAuto) meta.append(el('span', 'chip', m.via));
  if (m.thread) meta.append(el('span', 'chip', m.thread));
  if (overHop) {
    const b = el('button', 'release', '放行');
    b.onclick = () => fetch('/api/hop-reset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ thread: m.thread }) });
    meta.append(b);
  }
  meta.append(el('span', null, '#' + m.seq));
  wrap.append(meta);
  if (mine) { const p = pendingNode(m); if (p) wrap.append(p); }
  row.append(wrap);
  return row;
}

/**
 * 我发的人肉消息：没人回就给个状态。
 * 没这个的话用户看到的就是「发出去、石沉大海」——实际可能是总开关没开、
 * 被反循环闸拦了（连发两句一样的话）、或者 @ 了个没 driver 的 agent。
 */
const PENDING = new Map();   // seq -> 'wait' | 'note'
const PENDING_TXT = new Map();
const PENDING_WAIT_MS = 15000;   // 15 秒还没人接，去问后端为什么

function pendingNode(m) {
  const st = PENDING.get(m.seq);
  if (!st) return null;
  const d = el('div', 'pending ' + (st === 'wait' ? 'wait' : 'note'));
  d.textContent = st === 'wait'
    ? '等待回复…'
    : (PENDING_TXT.get(m.seq) || '没人回');
  return d;
}

async function refreshPending(seq) {
  if (PENDING.get(seq) !== 'wait') return;
  PENDING.set(seq, 'note');
  try {
    const r = await (await fetch(`/api/why?seq=${seq}`)).json();
    PENDING_TXT.set(seq, r.text || '没人回（原因未知）');
  } catch { PENDING_TXT.set(seq, '查不到原因'); }
  renderMsgs();
}

/** 扫一遍我发的、还没人回的消息，登记待观察 */
function scanPending() {
  const answered = new Set(MSGS.filter((m) => m.reply_to).map((m) => m.reply_to));
  const cutoff = Date.now() - 600000;   // 只看 10 分钟内的，别把老消息全标黄
  for (const m of MSGS) {
    if (m.from !== 'human') continue;
    if (m.via && m.via !== 'human') continue;
    if (answered.has(m.seq)) { PENDING.delete(m.seq); continue; }
    if (Date.parse(m.ts) < cutoff) continue;
    if (PENDING.has(m.seq)) continue;
    PENDING.set(m.seq, 'wait');
    setTimeout(() => refreshPending(seqOf(m)), PENDING_WAIT_MS);
  }
}
const seqOf = (m) => m.seq;
function typingNode() {
  const busy = (STATE?.members || []).filter((m) => m.state === 'thinking' && m.currentSeq);
  const frag = document.createDocumentFragment();
  for (const b of busy) {
    const row = el('div', 'row');
    row.append(avatarNode(b.name));
    const wrap = el('div', 'bubblewrap');
    const bub = el('div', 'bubble auto typing');
    bub.append(el('i'), el('i'), el('i'));
    wrap.append(bub);
    const meta = el('div', 'meta2');
    meta.append(el('span', null, `${b.name} 正在输入… #${b.currentSeq}`));
    wrap.append(meta);
    row.append(wrap);
    frag.append(row);
  }
  return frag;
}

function renderMsgs() {
  const box = $('#msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = '';
  const list = MSGS.filter(passFilter).slice(-400);
  if (!list.length) { box.append(el('div', 'empty', '还没有消息')); return; }

  let prevDay = '';
  let prevMsg = null;
  for (const m of list) {
    const dk = dayKey(m.ts);
    if (dk && dk !== prevDay) {
      prevDay = dk;
      const d = el('div', 'day');
      d.append(el('span', null, isToday(m.ts) ? '今天' : dk));
      box.append(d);
      prevMsg = null; // 跨天不再合并
    }
    box.append(msgNode(m, prevMsg));
    prevMsg = m;
  }
  box.append(typingNode());
  scanPending();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function renderEvents() {
  const box = $('#events');
  if (!SEL) return;
  const evs = (EVENTS.get(SEL) || []).slice(-120);
  box.innerHTML = '';
  if (!evs.length) { box.innerHTML = '<div class="empty">这个 agent 还没有活动</div>'; return; }
  for (const e of evs) {
    if (e.type === 'thought') {
      const d = el('div', 'ev thought'); d.textContent = e.text; box.append(d);
    } else if (e.type === 'answer') {
      const d = el('div', 'ev answer'); d.textContent = e.text; box.append(d);
    } else if (e.type === 'tool') {
      box.append(el('div', 'ev tool', `▸ ${e.name || 'tool'} ${e.status || ''}`));
    } else if (e.type === 'replied') {
      box.append(el('div', 'ev replied', `↩ 回复 #${e.seq} → ${e.to}（hop ${e.hop}）`));
    } else if (e.type === 'error') {
      box.append(el('div', 'ev error', '✕ ' + e.message));
    } else if (e.type === 'usage') {
      const u = e.usage || {};
      box.append(el('div', 'ev', `token in=${u.inputTokens ?? '?'} out=${u.outputTokens ?? '?'}`));
    }
  }
  box.scrollTop = box.scrollHeight;
}

function renderAll() { renderMembers(); renderCeo(); renderConfig(); renderTasks(); renderCounts(); renderMsgs();
  // 成员上下线会变（driver 是独立进程），输入框提示里的「谁会抢着回」
  // 也得跟着变，否则 driver 起来了界面上还印着旧的名单。
  // updateTip 只读输入框当前值重算，幂等，不会打断正在打字的人。
  updateTip();
}

// ---------- 数据 ----------
async function loadState() { STATE = await (await fetch('/api/state')).json(); renderAll(); }
async function loadLog() {
  const r = await (await fetch('/api/log?since=0&limit=600')).json();
  MSGS = r.messages || [];
  renderMsgs();
}

function connect() {
  const es = new EventSource('/stream');
  es.addEventListener('hello', () => {});
  es.addEventListener('msg', (ev) => {
    const m = JSON.parse(ev.data);
    if (MSGS.some((x) => x.seq === m.seq)) return;
    MSGS.push(m);
    MSGS.sort((a, b) => a.seq - b.seq);
    renderMsgs();
  });
  es.addEventListener('agent', (ev) => {
    const e = JSON.parse(ev.data);
    const arr = EVENTS.get(e.agent) || [];
    arr.push(e);
    if (arr.length > 300) arr.splice(0, arr.length - 300);
    EVENTS.set(e.agent, arr);
    if (e.agent === SEL) renderEvents();
  });
  es.addEventListener('state', (ev) => {
    STATE = JSON.parse(ev.data);
    AGENTS = (STATE.members || []).map((m) => m.name);
    renderAll();
  });
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

// ---------- 交互 ----------
const AGENT_SET = () => new Set((STATE?.members || []).map((m) => m.name));

/** 输入框上方实时提示：这条会发给谁。不点名 = @全体。 */
function updateTip() {
  const ta = $('#say');
  const tip = $('#composertip');
  if (!ta || !tip) return;
  const m = ta.value.match(/@([a-z0-9_-]+)/i);
  if (m) {
    const n = m[1].toLowerCase();
    const known = AGENT_SET().has(n);
    tip.className = 'tip named';
    tip.textContent = known
      ? `只发给 @${n}${n === (STATE?.ceo || '') ? '（CEO）' : ''}`
      : `@${n} 不是群成员（群里现在有：${(STATE?.members || []).map((x) => x.name).join(' / ')}）`;
    return;
  }
  // 空输入和不带 @ 的输入走同一条路。
  // 之前空输入直接写死「Hermes / OpenCode」，dsh 接进来以后这里就成了
  // 界面上唯一还没反映新成员的地方：三个人抢答，提示里却只印两个。
  // 这里同样要报开关关 / 没人跑 —— 空着的时候正是用户最该看到预警的时刻。
  tip.className = 'tip';
  const live = (STATE?.members || []).filter((x) => x.online).map((x) => x.name);
  if (!STATE?.config?.autoChat) {
    tip.textContent = '⚠ 总开关关着，发出去不会有人回（左栏打开「总开关」）';
    tip.className = 'tip warn';
  } else if (!live.length) {
    tip.textContent = '⚠ 没有 driver 在跑，发出去不会有人回';
    tip.className = 'tip warn';
  } else {
    tip.textContent = `发给全体 · ${live.join(' / ')} 谁先抢到谁回`;
  }
}

async function send() {
  const ta = $('#say');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  updateTip();
  $('#send').disabled = true;
  try {
    // to/mentions 不自己算，交给 /api/say 从文本里解析 —— 总线不该信任
    // 客户端传的收件人（同一个 API 也被 tools/say.mjs 和 curl 调）。
    await fetch('/api/say', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ from: 'human', text }),
    });
  } finally { $('#send').disabled = false; }
}

$('#send').onclick = send;
$('#say').addEventListener('input', updateTip);
$('#say').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#autoSw').onclick = () => {
  const on = !(STATE?.config?.autoChat);
  fetch('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ autoChat: on }) });
};
$('#maxHop').onchange = (e) => {
  fetch('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ maxHop: Number(e.target.value) }) });
};
$('#ceoPick').onchange = (e) => {
  fetch('/api/ceo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: e.target.value }) });
};
$('#cancelBtn').onclick = () => {
  if (!SEL) return;
  fetch('/api/cancel', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ agent: SEL }) });
};
document.querySelectorAll('.filter button').forEach((b) => {
  b.onclick = () => {
    FILTER = b.dataset.f;
    document.querySelectorAll('.filter button').forEach((x) => x.classList.toggle('on', x === b));
    renderMsgs();
  };
});

// ---------- 启动 ----------
(async () => {
  await loadState();
  AGENTS = (STATE.members || []).map((m) => m.name);
  await loadLog();
  connect();
  updateTip();
  setInterval(loadState, 5000);
})();
</script>
</body>
